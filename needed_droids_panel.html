<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Droid Tycoon — Needed Droids Tracker</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: #161b22;
    --panel-2: #1c232c;
    --border: #2a313c;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --good: #3fb950;
    --warn: #d29922;
    --done: #30363d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, #11161d, #0e1116);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .totals { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 10px; }
  .totals .t { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; }
  .totals .t b { color: var(--accent); font-size: 16px; }
  .totals .t span { color: var(--muted); font-size: 11px; display: block; }

  main { padding: 16px 20px 60px; display: grid; grid-template-columns: 1fr 340px; gap: 18px; }
  @media (max-width: 920px) { main { grid-template-columns: 1fr; } }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .panel h2 { margin: 0 0 10px; font-size: 14px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); }

  /* Current progress controls */
  .controls { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  .controls label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 4px; }
  select, input[type=number] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 8px; font-size: 13px;
  }

  /* Super-cycle grid */
  .cycles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  @media (max-width: 1100px) { .cycles { grid-template-columns: repeat(2, 1fr); } }
  .cycle { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .cycle h3 { margin: 0 0 8px; font-size: 12px; color: var(--accent); text-align: center; }
  .stagegrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .cell {
    border: 1px solid var(--border); border-radius: 5px; padding: 5px 3px; text-align: center;
    cursor: pointer; background: #11161d; transition: .12s; user-select: none;
  }
  .cell:hover { border-color: var(--accent); }
  .cell .rb { font-size: 10px; color: var(--muted); }
  .cell .chips { display: flex; gap: 2px; justify-content: center; margin-top: 3px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(255,255,255,.15); }
  .cell.past { opacity: .35; }
  .cell.current { outline: 2px solid var(--good); background: #11261a; }
  .cell.selected { outline: 2px solid var(--accent); }
  .cell.droid-match { outline: 2px solid var(--warn); background: #2a2113; }

  /* Color map */
  .color-base    { background: #9aa0a6; }
  .color-default { background: #c9d1d9; }
  .color-gold    { background: linear-gradient(135deg,#f5c518,#b8860b); }
  .color-diamond { background: linear-gradient(135deg,#bff4ff,#5fd0ee); }
  .color-rainbow { background: linear-gradient(135deg,#ff5d5d,#ffd24d,#5dff8f,#5db8ff,#c45dff); }
  .color-beskar  { background: linear-gradient(135deg,#d7dde3,#9aa7b3); }
  .color-galactic{ background: linear-gradient(135deg,#b15be0,#6f2db8); }

  /* Detail / upcoming / legend */
  .detail-droid { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .detail-droid:last-child { border-bottom: none; }
  .detail-droid .name { flex: 1; }
  .detail-droid .color-tag { font-size: 11px; color: var(--muted); }
  .cost { margin-top: 10px; font-size: 12px; color: var(--muted); }
  .cost b { color: var(--text); }

  .upcoming-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
  .upcoming-item:last-child { border-bottom: none; }
  .upcoming-item .stage-id { width: 64px; font-size: 11px; color: var(--accent); flex-shrink: 0; }

  .legend { display: flex; flex-wrap: wrap; gap: 8px; }
  .legend .item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend .swatch { width: 14px; height: 14px; }

  .checklist .item { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .checklist .count { font-size: 11px; color: var(--muted); margin-left: auto; }
  .checklist input { accent-color: var(--good); }

  .quarantine { color: var(--warn); font-size: 11px; margin-top: 8px; }
  .note { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .section-gap { margin-top: 18px; }

  /* Droid-necessity verdict (task t_e9543457) — mirrors webui necessity-box */
  .necessity-box { margin-top: 10px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 8px; background: #11161d; }
  .nec-head { font-size: 11px; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .nec-verdict { font-size: 15px; font-weight: 700; margin-bottom: 10px; }
  .nec-verdict .verdict.yes { color: var(--warn); }
  .nec-verdict .verdict.no  { color: var(--good); }
  .nec-droid { color: var(--text); font-weight: 700; }
  .nec-sub { font-size: 12px; color: var(--muted); margin: 6px 0 8px; }
  .necessity-box .droid { background: #161b22; }
</style>
</head>
<body>
<header>
  <h1>Droid Tycoon — Needed Droids Tracker</h1>
  <div class="sub">Which droids are required for each rebirth stage. Data extracted from the project workbooks (REBIRTH_DATA_SCHEMA.md).</div>
  <div class="totals" id="totals"></div>
</header>

<main>
  <div>
    <div class="panel">
      <h2>Rebirth Map — click a stage to inspect</h2>
      <div class="controls">
        <div>
          <label>Current Super Rebirth</label>
          <select id="cur-sr"></select>
        </div>
        <div>
          <label>Current Rebirth</label>
          <select id="cur-rb"></select>
        </div>
        <div>
          <label>Droid Selection</label>
          <select id="droid-sel"><option value="">— Select a droid —</option></select>
        </div>
      </div>
      <div class="cycles" id="cycles"></div>
      <div class="note" id="droid-usage"></div>
      <div class="note" id="progress-note"></div>
    </div>
  </div>

  <div>
    <div class="panel">
      <h2>Stage Detail</h2>
      <div id="detail"></div>
    </div>

    <div class="panel section-gap">
      <h2>Upcoming Needed Droids</h2>
      <div id="upcoming"></div>
    </div>

    <div class="panel section-gap">
      <h2>Droid Checklist (all stages)</h2>
      <div class="checklist" id="checklist"></div>
      <div class="note" id="checklist-note"></div>
    </div>

    <div class="panel section-gap">
      <h2>Color Legend</h2>
      <div class="legend" id="legend"></div>
      <div class="quarantine" id="quarantine"></div>
    </div>
  </div>
</main>

<script id="data" type="application/json">__DATA_JSON__</script>
<script>
"use strict";

let DATA = null;

// ---- Color helpers ----
const COLOR_CLASS = {
  'Base': 'color-base', 'Default': 'color-default', 'Gold': 'color-gold',
  'Diamond': 'color-diamond', 'Rainbow': 'color-rainbow', 'Beskar': 'color-beskar',
  'Galactic': 'color-galactic'
};
function colorClass(c){ return COLOR_CLASS[c] || 'color-default'; }
function swatch(c){ return `<span class="swatch ${colorClass(c)}" title="${c}"></span>`; }
function fmt(n){ return n==null ? '\u2014' : n.toLocaleString('en-US'); }

// ---- Visible error banner (only shown if data cannot be loaded at all) ----
function showError(msg){
  let b = document.getElementById('error-banner');
  if (!b){
    b = document.createElement('div');
    b.id = 'error-banner';
    b.style.cssText = 'position:sticky;top:0;z-index:50;background:#7d1f1f;color:#ffd7d7;'
      + 'border-bottom:1px solid #b33434;padding:10px 16px;font-size:13px;line-height:1.4;';
    document.body.prepend(b);
  }
  b.textContent = msg;
}

// ---- Resilient data loader ----
// Prefers the inlined #data JSON (built output). If the template still holds the
// build placeholder (or the inline blob is malformed), fetch the JSON
// file so the panel works when served over HTTP. Throws only if both fail.
async function loadData(){
  const el = document.getElementById('data');
  const raw = el ? el.textContent.trim() : '';
  if (raw){
    try { return JSON.parse(raw); }
    catch (e) { /* inline data is not valid JSON (e.g. the build placeholder) ->
                    placeholder, or a malformed blob) -> fall through to fetch */ }
  }
  const res = await fetch('data/rebirth_data.json', {cache:'no-store'});
  if (!res.ok) throw new Error('Could not load data/rebirth_data.json (HTTP ' + res.status + ')');
  return await res.json();
}

// ---- Shared state ----
let SR_MIN, SR_MAX, RB_MIN, RB_MAX, curSR, curRB, selected = null, selectedDroid = null;

function stageKey(s,r){ return s+'-'+r; }
function getStage(s,r){ return DATA.stages[stageKey(s,r)]; }

// ---- Totals ----
function renderTotals(){
  const t = DATA.totals;
  const items = [
    ['Stages', t.stages],
    ['Super Cycles', t.super_cycles],
    ['Rebirths / Cycle', t.rebirths_per_cycle],
    ['Droids / Stage', DATA.droids_per_stage],
    ['Distinct Droids', t.distinct_droid_names],
    ['Total Requirements', t.droids_total],
  ];
  document.getElementById('totals').innerHTML = items.map(
    ([k,v]) => `<div class="t"><b>${v}</b><span>${k}</span></div>`
  ).join('');
}

// ---- Cycle grid ----
function renderCycles(){
  const wrap = document.getElementById('cycles');
  wrap.innerHTML = '';
  for (let s=SR_MIN; s<=SR_MAX; s++){
    const col = document.createElement('div'); col.className='cycle';
    col.innerHTML = `<h3>Super Rebirth ${s}</h3>`;
    const grid = document.createElement('div'); grid.className='stagegrid';
    for (let r=RB_MIN; r<=RB_MAX; r++){
      const st = getStage(s,r);
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (s < curSR || (s===curSR && r < curRB)) cell.classList.add('past');
      if (s===curSR && r===curRB) cell.classList.add('current');
      if (selected===stageKey(s,r)) cell.classList.add('selected');
      if (selectedDroid && st.droids.some(d => d.droid_name === selectedDroid)) cell.classList.add('droid-match');
      const chips = st.droids.map(d => swatch(d.droid_color)).join('');
      cell.innerHTML = `<div class="rb">R${r}</div><div class="chips">${chips}</div>`;
      cell.onclick = () => { selected = stageKey(s,r); renderDetail(s,r); renderCycles(); };
      grid.appendChild(cell);
    }
    col.appendChild(grid);
    wrap.appendChild(col);
  }
  document.getElementById('progress-note').textContent =
    `You are at SR ${curSR}, R ${curRB}. Past stages are dimmed; the green outline is your current stage.`;
}

// ---- Detail ----
function renderDetail(s,r){
  const st = getStage(s,r);
  if (!st){ document.getElementById('detail').innerHTML='<div class="note">No data for this stage.</div>'; return; }
  const rows = st.droids.map(d =>
    `<div class="detail-droid"><span class="name">${d.droid_name}</span>${swatch(d.droid_color)}<span class="color-tag">${d.droid_color}</span></div>`
  ).join('');
  const cost = st.cost || {};
  const costHtml = `<div class="cost">Rebirth cost \u2014 Credits: <b>${fmt(cost.credits)}</b></div><div class="cost">Nova Crystals Gained: <b>${fmt(cost.nova)}</b></div>`;
  document.getElementById('detail').innerHTML =
    `<div class="note" style="margin-bottom:6px">Super Rebirth <b>${s}</b> \u00b7 Rebirth <b>${r}</b> \u2014 needs ${st.droids.length} droids:</div>${rows}${costHtml}`;
}

// ---- Upcoming ----
function nextStage(s,r){
  if (r < RB_MAX) return {s:s, r:r+1};
  return {s:s+1, r:RB_MIN};
}
function renderUpcoming(){
  // Show every remaining stage of the current super rebirth cycle (no count limit).
  // When a droid is selected, only stages requiring that droid are listed.
  const out = [];
  let s=curSR, r=curRB;
  ({s,r} = nextStage(s,r));
  while (s === curSR && s<=SR_MAX){
    const st = getStage(s,r);
    if (st){
      const stDroids = selectedDroid
        ? st.droids.filter(d => d.droid_name === selectedDroid)
        : st.droids;
      if (stDroids.length){
        const chips = stDroids.map(d => swatch(d.droid_color)).join('');
        const names = stDroids.map(d => d.droid_name).join(', ');
        out.push(`<div class="upcoming-item"><span class="stage-id">SR${s} R${r}</span>${chips}<span style="font-size:12px">${names}</span></div>`);
      }
    }
    ({s,r} = nextStage(s,r));
  }
  document.getElementById('upcoming').innerHTML = out.join('') ||
    (selectedDroid
      ? `<div class="note">${selectedDroid} is not required in any remaining stage of Super Rebirth ${curSR}.</div>`
      : '<div class="note">No upcoming stages remaining in this super rebirth cycle.</div>');
}

// ---- Checklist (distinct droids across all stages) ----
function renderChecklist(){
  const counts = {};
  for (const key in DATA.stages){
    const st = DATA.stages[key];
    for (const d of st.droids){
      if (!counts[d.droid_name]) counts[d.droid_name] = {stages:new Set(), colors:new Set()};
      counts[d.droid_name].stages.add(key);
      counts[d.droid_name].colors.add(d.droid_color);
    }
  }
  const names = Object.keys(counts).sort();
  const wrap = document.getElementById('checklist');
  wrap.innerHTML = names.map(name => {
    const c = counts[name];
    const cols = [...c.colors].map(swatch).join('');
    return `<div class="item"><input type="checkbox" id="cb-${name}"><label for="cb-${name}">${name}</label><span class="count">${c.stages.size} stages ${cols}</span></div>`;
  }).join('');
  document.getElementById('checklist-note').textContent =
    `${names.length} distinct droids required across all ${DATA.totals.stages} stages. Tick off what you own.`;
}

// ---- Legend + quarantine ----
function renderLegend(){
  const colors = DATA.reference.colors;
  document.getElementById('legend').innerHTML = colors.map(c =>
    `<div class="item">${swatch(c)}<span>${c}</span></div>`
  ).join('');
  const q = DATA.quarantined || [];
  if (q.length){
    const list = q.map(x => `SR${x.super_rebirth} R${x.rebirth}: ${x.droid_name} (${x.droid_color})`).join(' \u00b7 ');
    document.getElementById('quarantine').textContent =
      `Quarantined data-error rows (excluded): ${list}`;
  }
}

// ---- Droid necessity (ported from webui/super_rebirth_cycle.js, task t_b5c5e75a) ----
// Pure: given the requirement rows for one super cycle plus the player's current
// (superRebirth, rebirth) position, decide whether the droid is STILL needed
// for remaining steps. `needed` => keep/buy; !needed => safe to sell/skip.
function computeDroidNecessity(droidId, currentStage, cycleRequirements){
  if (typeof droidId !== 'string' || !droidId.trim())
    throw new Error('droidId must be a non-empty string.');
  if (!currentStage || typeof currentStage.superRebirth !== 'number' ||
      typeof currentStage.rebirth !== 'number')
    throw new Error('currentStage must be { superRebirth, rebirth }.');
  const id = droidId.trim().toLowerCase();
  const { superRebirth, rebirth: currentR } = currentStage;
  const matches = (cycleRequirements || [])
    .filter(r => r.superRebirth === superRebirth &&
                 (r.droidName || '').toLowerCase() === id)
    .map(r => ({ superRebirth: r.superRebirth, rebirth: r.rebirth, color: r.droidColor }));
  const currentStageReq = matches.find(m => m.rebirth === currentR) || null;
  const remainingStages = matches.filter(m => m.rebirth > currentR);
  const clearedStages = matches.filter(m => m.rebirth < currentR);
  const needed = currentStageReq !== null || remainingStages.length > 0;
  return {
    needed,
    superRebirth,
    currentRebirth: currentR,
    currentStage: currentStageReq,
    remainingStages,
    remainingColors: [...new Set(remainingStages.map(s => s.color))],
    clearedStages,
  };
}

// Build the cycle-requirement rows for one super cycle from the inline DATA model.
function getCycleRequirements(superRebirth){
  const out = [];
  for (const key in DATA.stages){
    const st = DATA.stages[key];
    if (st.super_rebirth !== superRebirth) continue;
    for (const d of st.droids)
      out.push({ superRebirth, rebirth: st.rebirth, droidName: d.droid_name, droidColor: d.droid_color });
  }
  return out;
}

// ---- Droid selection readout + necessity verdict (task t_e9543457) ----
function renderDroidUsage(){
  const el = document.getElementById('droid-usage');
  if (!el) return;
  if (!selectedDroid){ el.innerHTML = ''; return; }

  // 1) Everywhere the droid is used across all stages.
  const hits = [];
  for (const key in DATA.stages){
    const st = DATA.stages[key];
    for (const d of st.droids){
      if (d.droid_name === selectedDroid) hits.push({s: st.super_rebirth, r: st.rebirth, c: d.droid_color});
    }
  }

  // 2) Necessity within the currently-selected super cycle / stage.
  const necessity = computeDroidNecessity(selectedDroid,
    { superRebirth: curSR, rebirth: curRB },
    getCycleRequirements(curSR));
  const needed = necessity.needed;

  const verdict = needed
    ? `<span class="verdict yes">Still needed — keep / do not sell</span>`
    : `<span class="verdict no">Safe to sell / skip</span>`;

  // Remaining-stage detail.
  let detail = '';
  const rem = necessity.remainingStages || [];
  if (rem.length){
    detail = `<div class="nec-sub">Still required in these upcoming rebirths of Super Rebirth ${curSR}:</div>`
      + rem.map(s =>
          `<div class="detail-droid"><span class="swatch ${colorClass(s.color)}"></span>`
        + `<span class="name">R${s.rebirth}</span><span class="color-tag">${s.color}</span></div>`
        ).join('');
  } else if (needed && necessity.currentStage){
    detail = `<div class="upcoming-item" style="border:none"><span class="swatch ${colorClass(necessity.currentStage.color)}"></span>`
      + `<span style="font-size:12px">Required right now at R${necessity.currentStage.rebirth} (${necessity.currentStage.color}).</span></div>`;
  } else {
    detail = `<div class="nec-sub">Not needed for any remaining stage in Super Rebirth ${curSR}.</div>`;
  }
  const cleared = (necessity.clearedStages || []).length;
  const clearedNote = cleared
    ? `<div class="nec-sub" style="margin-top:8px">Already satisfied at ${cleared} earlier stage(s) in this cycle.</div>`
    : '';

  const everywhere = hits.length
    ? `<div class="nec-sub">Also appears in ${hits.length} stage(s) overall (across all super cycles): `
      + hits.map(h => `SR${h.s} R${h.r}`).join(' · ') + `</div>`
    : `<div class="nec-sub">Not used in any stage of the data set.</div>`;

  el.innerHTML =
    `<div class="necessity-box">`
    + `<div class="nec-head">Sell / keep check (from your current SR ${curSR}, R ${curRB})</div>`
    + `<div class="nec-verdict">${verdict} <span class="nec-droid">${selectedDroid}</span></div>`
    + detail + clearedNote + everywhere
    + `</div>`;
}

// ---- Wire up controls ----
function wireUp(srSel, rbSel){
  srSel.onchange = () => { curSR = +srSel.value; renderCycles(); renderUpcoming(); renderDroidUsage(); };
  rbSel.onchange = () => { curRB = +rbSel.value; renderCycles(); renderUpcoming(); renderDroidUsage(); };
}

// ---- Bootstrap (runs after data is available) ----
async function boot(){
  DATA = await loadData();
  SR_MIN = DATA.super_cycle_range[0]; SR_MAX = DATA.super_cycle_range[1];
  RB_MIN = DATA.rebirth_range[0];     RB_MAX = DATA.rebirth_range[1];
  selected = null;

  const srSel = document.getElementById('cur-sr');
  const rbSel = document.getElementById('cur-rb');
  const droidSel = document.getElementById('droid-sel');
  (DATA.reference.droids || []).forEach(name => droidSel.add(new Option(name, name)));
  droidSel.onchange = () => { selectedDroid = droidSel.value || null; renderCycles(); renderUpcoming(); renderDroidUsage(); };
  for (let s=SR_MIN; s<=SR_MAX; s++) srSel.add(new Option('SR '+s, s));
  for (let r=RB_MIN; r<=RB_MAX; r++) rbSel.add(new Option('R '+r, r));
  curSR = SR_MIN; curRB = RB_MIN;
  srSel.value = curSR; rbSel.value = curRB;

  renderTotals();
  renderLegend();
  wireUp(srSel, rbSel);

  selected = stageKey(curSR, curRB);
  renderCycles();
  renderDetail(curSR, curRB);
  renderUpcoming();
  renderChecklist();
  renderDroidUsage();
}

boot().catch(err => showError(
  'Failed to load Needed Droids data: ' + err.message +
  '  \u2192 If opening this file directly, serve it first (e.g. "python -m http.server" from the DroidTycoon folder) so data/rebirth_data.json can be fetched,' +
  ' or run "python make_panel.py" to inline the data into index.html.'
));
</script>
</body>
</html>
